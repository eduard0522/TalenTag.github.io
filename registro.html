<!-- Contenido principal -->
<body class=" flex-col min-h-screen dark:bg-gray-800 text-gray-700 dark:text-gray-100 transition-colors duration-300">
    
<!-- Barra de navegación (Navigation Bar) -->

    <!-- Logo -->

        <a href="index.html" class="logo-link">

    <!-- Links de navegacion -->
    <ul>
        <li><a href="index.html" class="hover:text-cyan-900 transition">Inicio</a></li>
        <li><a href="crea.html" class="hover:text-cyan-800  transition">Crea</a></li>
        <li><a href="precios.html" class="hover:text-cyan-800 transition">Precios</a></li>
        <li><a href="soporte.html" class="hover:text-cyan-800 transition">Soporte</a></li>
    </ul>

    <!-- Botón de iniciar sesión -->
    <div class="btnsContainer">
        <a href="iniciar sesion.html"
            class="btn-iniciar-sesion bg-cyan-400 text-gray-700 dark:text-gray-700 hover:cyan-700 rounded-md transition  font-bold duration-300">
            Iniciar sesión
        </a>
        <!-- Botón de modo nocturno -->
        <button id="darkModeToggle"
            class="px-2 py-2 bg-gray-700 dark:bg-white shadow-lg-white-500 rounded-full hover:bg-gray-900 transition"
            aria-label="Modo oscuro">
        </button>
    </div>
    </nav>


    <!-- Contenido principal -->
    
    <div class="container w-full  flex flex-col items-center justify-center mt-16 px-4">
        <section class="mt-5 flex flex-col md:flex-row items-center dark:bg-gray-700 justify-center gap-8 bg-white shadow-lg rounded-lg p-8 max-w-4xl mx-auto"> 
            

            <!-- Formulario de registro -->
            <div class="bg-gray-50 p-4 dark:bg-gray-500  rounded-lg shadow-md w-full md:w-1/2">

                <h2 class="text-3xl font-semibold text-center text-cyan-500 mb-4">Talen<span class="text-black">Tag.com</span></h2>

                <form class="flex flex-col gap-2">
                    <div class="flex flex-col">
                        <label for="name" class="font-semibold">Nombre:</label>
                        <input type="text" id="name" class="border border-gray-300 rounded-lg p-2" placeholder="Tu nombre" required>
                    </div>
                    <div class="flex flex-col">
                        <label for="name" class="font-semibold">Alias:</label>
                        <input type="text" id="name" class="border border-gray-300 rounded-lg p-2" placeholder="Tu alias" required>
                    </div>
                    
                    <div class="flex flex-col">
                        <label for="email" class="font-semibold">Correo Electrónico:</label>
                        <input type="email" id="email" class="border border-gray-300 rounded-lg p-2" placeholder="ejemplo@mail.com" required>
                    </div>
                    
                    <div class="flex flex-col">
                        <label for="password" class="font-semibold">Contraseña:</label>
                        <input type="password" id="password" class="border border-gray-300 rounded-lg p-2" placeholder="Crea una contraseña segura" required>
                    </div>

                    <div class="flex flex-col">
                        <input type="password" id="confirm-password" class="border border-gray-300 rounded-lg p-2" placeholder="Repite tu contraseña" required>
                    </div>
                    <h2 class="mt-1"></h2>
                    <button type="submit" class="bg-cyan-400 py-2 text-gray-700 rounded-lg hover:bg-cyan-500 transition">Registrarse</button>
                
                
                <p class="dark:text-gray-100 mt-4">¿Ya tienes una cuenta? <a href="iniciar Sesion.html" class="text-cyan-700 dark:text-gray-100 hover:underline">Inicia sesión</a></p>

                <div class="flex justify-center gap-4 mt-4">
                    <a href="#"><img src="Logos/Logo Facebook.png" alt="Facebook" class="w-8"></a>
                    <a href="#"><img src="Logos/Logo Google.png" alt="Google" class="w-8"></a>
                    <a href="#"><img src="Logos/Logo X.png" alt="X" class="w-8"></a>
                </div>
            </form>        
        </div>
            <!-- Texto de bienvenida -->
            <div class="w-full md:w-1/2  text-center md:text-center dark:text-gray-100">                
                <h2 class="text-2xl dark:text-white-800 font-bold  dark:text-gray-100">Regístrate</h2>
                <p class="text-gray-700 dark:text-gray-100 mt-2">Crea, personaliza y comparte tu portafolio profesional con el mundo.</p>
                <p class="text-gray-700 dark:text-gray-100 mt-2">Conéctate con empleadores y destaca tu talento.</p>
            </div>
            

<script>
    document.addEventListener("DOMContentLoaded", function () {

        // ==== MODO OSCURO ====
        const toggleBtn = document.getElementById('darkModeToggle');
        const html = document.documentElement;

        // Cargar preferencia del usuario
        const themeGuardado = localStorage.getItem("theme");
        if (themeGuardado === "dark") {
            html.classList.add("dark");
        }

        // Función para actualizar el icono del botón
        function actualizarIcono() {
            toggleBtn.textContent = html.classList.contains('dark') ? '🌞' : '🌙';
        }

        actualizarIcono(); // Al iniciar

        // Evento de clic
        toggleBtn.addEventListener("click", () => {
            html.classList.toggle("dark");
            const nuevoTema = html.classList.contains("dark") ? "dark" : "light";
            localStorage.setItem("theme", nuevoTema);
            actualizarIcono();
        });
    });
</script>


</div>



<!-- Pie de página -->
<footer class="mt-10 p-4 text-gray-600">

</html>
